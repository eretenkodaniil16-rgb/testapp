name: Validate and publish live test content

on:
  push:
    branches: [content-live]
    paths:
      - "public/content/**"
      - "scripts/unify-hygiene-work-topic.mjs"
      - "scripts/sync-content-manifest.mjs"
      - "scripts/validate-content.mjs"
      - ".github/workflows/content.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-live-publish
  cancel-in-progress: false

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content-live
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unify current hygiene topics
        run: node scripts/unify-hygiene-work-topic.mjs
      - name: Synchronize manifest
        run: node scripts/sync-content-manifest.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run validate:content
      - name: Publish synchronized content
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/content)" ]; then
            echo "Content already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content
          git commit -m "content: unify hygiene under occupational hygiene"
          git push origin HEAD:content-live
