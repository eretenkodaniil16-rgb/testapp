name: Content CI

on:
  push:
    branches: [content-live]
    paths:
      - "public/content/**"
      - "scripts/validate-content.mjs"
      - "scripts/audit-pharmacology-source.mjs"
      - "scripts/audit-general-surgery-source.mjs"
      - ".github/workflows/content-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-content.mjs
      - name: Audit pharmacology source bank
        run: node scripts/audit-pharmacology-source.mjs 1062
      - name: Audit general surgery source bank
        run: node scripts/audit-general-surgery-source.mjs
