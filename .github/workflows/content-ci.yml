name: Content CI

on:
  push:
    branches: [content-live]
    paths:
      - "public/content/**"
      - "scripts/validate-content.mjs"
      - ".github/workflows/content-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-content.mjs
