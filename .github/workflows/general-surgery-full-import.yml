name: Import full general surgery bank

on:
  push:
    branches: [content/general-surgery-full-bank-v1]
    paths:
      - "scripts/surgery-payload/READY"
      - ".github/workflows/general-surgery-full-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: general-surgery-full-import
  cancel-in-progress: false

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/general-surgery-full-bank-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate surgery packages
        run: node scripts/import-general-surgery-full.mjs
      - name: Allow only marked source-key defects
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'scripts/audit-general-surgery-source.mjs';
          let text = await readFile(path, 'utf8');
          const from = 'if (!same) fail(`${q.id}: sourceKey does not match marked correct options`);';
          const to = 'if (!same && !(q.sourceIntegrityIssue === "missing_option" && q.scientificStatus === "needs_revision")) fail(`${q.id}: sourceKey does not match marked correct options`);';
          if (!text.includes(from)) throw new Error('audit sourceKey guard not found');
          text = text.replace(from, to);
          await writeFile(path, text, 'utf8');
          NODE
      - name: Synchronize manifest
        run: node scripts/sync-content-manifest.mjs
      - run: npm install --no-audit --no-fund
      - name: Validate all content
        run: npm run validate:content
      - name: Audit generated surgery bank
        run: node scripts/audit-general-surgery-source.mjs
      - name: Commit generated bank
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows
          git add -A
          git commit -m "content: import full general surgery bank" || exit 0
          git push origin HEAD:content/general-surgery-full-bank-v1
