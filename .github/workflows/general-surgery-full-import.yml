name: Import full general surgery bank

on:
  push:
    branches: [content/general-surgery-full-bank-v1]
    paths:
      - "scripts/surgery-payload/READY"
      - ".github/workflows/general-surgery-full-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: general-surgery-full-import
  cancel-in-progress: false

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/general-surgery-full-bank-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate surgery packages
        run: node scripts/import-general-surgery-full.mjs
      - name: Synchronize manifest
        run: node scripts/sync-content-manifest.mjs
      - run: npm install --no-audit --no-fund
      - name: Validate all content
        run: npm run validate:content
      - name: Diagnose surgery source audit
        shell: bash
        run: |
          echo "--- audit sourceKey logic ---"
          sed -n '70,115p' scripts/audit-general-surgery-source.mjs
          echo "--- sourceKey mismatches ---"
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          const dir = 'public/content/packages';
          const names = (await readdir(dir)).filter((n) => n.startsWith('general-surgery-') && n.endsWith('.json'));
          for (const name of names) {
            const pkg = JSON.parse(await readFile(`${dir}/${name}`, 'utf8'));
            for (const q of pkg.questions ?? []) {
              if (!Object.hasOwn(q, 'sourceKey')) continue;
              const correct = (q.options ?? []).filter((o) => o.correct).map((o) => o.label ?? o.id);
              const src = Array.isArray(q.sourceKey) ? q.sourceKey.map(String) : [String(q.sourceKey)];
              const a = [...src].sort().join('|');
              const b = [...correct].map(String).sort().join('|');
              if (a !== b) console.log(JSON.stringify({id:q.id, sourceKey:q.sourceKey, correct, keys:Object.keys(q), status:q.status, needsRevision:q.needsRevision, tags:q.tags, audit:q.audit}));
            }
          }
          NODE
      - name: Audit generated surgery bank
        run: node scripts/audit-general-surgery-source.mjs
      - name: Commit generated bank
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: import full general surgery bank" || exit 0
          git push origin HEAD:content/general-surgery-full-bank-v1
